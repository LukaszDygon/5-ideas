<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="acidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#76ff03"/>
      <stop offset="60%" stop-color="#39ff14"/>
      <stop offset="100%" stop-color="#00b0ff"/>
    </linearGradient>
    <filter id="acidShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="1" flood-color="#1c1b1b"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="6" y="6" width="88" height="88" rx="14" fill="#f1f8e9" stroke="#1c1b1b" stroke-width="4" filter="url(#acidShadow)"/>
  <!-- Erlenmeyer Glass Flask Body -->
  <g stroke="#1c1b1b" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- Liquid -->
    <path d="M37 54 L24 74 C22 78 25 82 30 82 L70 82 C75 82 78 78 76 74 L63 54 C58 56 42 52 37 54 Z" fill="url(#acidGrad)"/>
    <!-- Glass Outline -->
    <path d="M42 20 L58 20 M44 20 L44 38 L24 72 C21 77 24 82 30 82 L70 82 C76 82 79 77 76 72 L56 38 L56 20" fill="none"/>
    <!-- Flask Lip -->
    <rect x="40" y="16" width="20" height="5" rx="2.5" fill="#fae100"/>
  </g>
  <!-- Bubbles -->
  <circle cx="42" cy="70" r="3.5" fill="#ffffff" stroke="#1c1b1b" stroke-width="1.5"/>
  <circle cx="58" cy="74" r="2.5" fill="#ffffff" stroke="#1c1b1b" stroke-width="1.5"/>
  <circle cx="50" cy="62" r="4.5" fill="#ffffff" stroke="#1c1b1b" stroke-width="1.5"/>
  <!-- Toxic Fumes Skull or Hazard mark -->
  <polygon points="50,68 53,74 47,74" fill="#1c1b1b"/>
  <path d="M48 30 Q52 26 50 24 Q48 22 52 18" fill="none" stroke="#39ff14" stroke-width="2.5" stroke-linecap="round"/>
</svg>
