[project]
name = "five-ideas-showcase"
version = "0.1.0"
description = "Five ideas a day, one shipped prototype: FastAPI site, Flask admin, SQLite, and a prototype registry."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "flask>=3.1.3",
    "httpx2>=2.13.1",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.4",
]

[project.scripts]
five-ideas = "showcase.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["showcase"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Our own code must not use deprecated APIs.
filterwarnings = ["error::DeprecationWarning:showcase.*"]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["dist", ".baseline"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # the formatter owns line length; long literal strings stay as written

[tool.ruff.lint.isort]
known-first-party = ["showcase"]

