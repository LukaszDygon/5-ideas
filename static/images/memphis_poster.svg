<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#1c1b1b" />
    </pattern>
    <pattern id="stripe-grid" width="20" height="20" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#1c1b1b" stroke-width="4" />
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="1000" fill="#fdfaf2" />
  <rect width="760" height="960" x="20" y="20" fill="none" stroke="#1c1b1b" stroke-width="8" />
  
  <!-- Halftone Underlay Block -->
  <rect x="50" y="80" width="320" height="420" fill="url(#dot-grid)" opacity="0.35" />
  
  <!-- Asymmetric Memphis Polygons -->
  <polygon points="120,120 440,80 380,360 80,320" fill="#00e5ff" stroke="#1c1b1b" stroke-width="6" />
  <rect x="360" y="240" width="340" height="340" fill="#fae100" stroke="#1c1b1b" stroke-width="6" />
  <polygon points="340,220 680,220 720,240 380,240" fill="#1c1b1b" />

  <!-- Diagonal Zebra Triangle -->
  <polygon points="160,420 400,660 160,660" fill="url(#stripe-grid)" stroke="#1c1b1b" stroke-width="6" />

  <!-- Neon Pink Memphis Arch -->
  <path d="M 440,750 A 140,140 0 0,1 720,750 L 720,840 L 440,840 Z" fill="#ff1493" stroke="#1c1b1b" stroke-width="6" />

  <!-- Squiggle Lines -->
  <path d="M 80,720 Q 140,680 200,720 T 320,720 T 440,720" fill="none" stroke="#ff1493" stroke-width="12" stroke-linecap="round" />
  <path d="M 80,740 Q 140,700 200,740 T 320,740 T 440,740" fill="none" stroke="#1c1b1b" stroke-width="12" stroke-linecap="round" />

  <!-- Confetti Elements -->
  <circle cx="280" cy="180" r="28" fill="#ff5e00" stroke="#1c1b1b" stroke-width="5" />
  <circle cx="580" cy="140" r="16" fill="#39ff14" stroke="#1c1b1b" stroke-width="4" />
  <rect x="620" y="380" width="35" height="35" fill="#ff1493" stroke="#1c1b1b" stroke-width="4" transform="rotate(25 637 397)" />
  <rect x="220" y="520" width="40" height="40" fill="#fae100" stroke="#1c1b1b" stroke-width="4" transform="rotate(45 240 540)" />

  <!-- Typography -->
  <rect x="80" y="800" width="640" height="120" fill="#ffffff" stroke="#1c1b1b" stroke-width="6" />
  <rect x="86" y="806" width="640" height="120" fill="#1c1b1b" opacity="0.15" />
  
  <text x="110" y="855" font-family="'Bricolage Grotesque', sans-serif" font-weight="900" font-size="42" fill="#1c1b1b" letter-spacing="2">MEMPHIS SQUIGGLE</text>
  <text x="110" y="895" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="18" fill="#b40065">PROCEDURAL POSTER #140 • 100% VECTOR SVG</text>
</svg>
