<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="coinGlow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fae100"/>
      <stop offset="80%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#cc6600"/>
    </radialGradient>
    <filter id="coinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="1" flood-color="#1c1b1b"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="6" y="6" width="88" height="88" rx="14" fill="#fffde7" stroke="#1c1b1b" stroke-width="4" filter="url(#coinShadow)"/>
  <!-- 3D Coin Outer Rim -->
  <circle cx="50" cy="50" r="36" fill="#1c1b1b"/>
  <circle cx="49" cy="49" r="35" fill="url(#coinGlow)" stroke="#1c1b1b" stroke-width="4"/>
  <!-- Beveled Inner Coin Ring -->
  <circle cx="49" cy="49" r="28" fill="none" stroke="#ff8000" stroke-width="3" stroke-dasharray="6,3"/>
  <circle cx="49" cy="49" r="24" fill="#fae100" stroke="#1c1b1b" stroke-width="3"/>
  <!-- Center Dollar / Star Emblem -->
  <text x="49" y="59" font-family="'Bricolage Grotesque', sans-serif" font-weight="900" font-size="32" fill="#1c1b1b" text-anchor="middle">$</text>
  <!-- Sparkle Flares -->
  <path d="M26 24 Q30 24 30 20 Q30 24 34 24 Q30 24 30 28 Q30 24 26 24 Z" fill="#ffffff" stroke="#1c1b1b" stroke-width="1.5"/>
  <path d="M68 66 Q72 66 72 62 Q72 66 76 66 Q72 66 72 70 Q72 66 68 66 Z" fill="#ffffff" stroke="#1c1b1b" stroke-width="1.5"/>
</svg>
