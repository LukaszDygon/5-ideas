<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="iceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#80d8ff"/>
      <stop offset="80%" stop-color="#0091ea"/>
      <stop offset="100%" stop-color="#01579b"/>
    </linearGradient>
    <filter id="iceShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="1" flood-color="#1c1b1b"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="6" y="6" width="88" height="88" rx="14" fill="#e1f5fe" stroke="#1c1b1b" stroke-width="4" filter="url(#iceShadow)"/>
  <!-- Central Ice EMP Snowflake / Crystal -->
  <g stroke="#1c1b1b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Diamond Crystal -->
    <polygon points="50,18 76,50 50,82 24,50" fill="url(#iceGrad)"/>
    <line x1="50" y1="18" x2="50" y2="82" stroke="#ffffff" stroke-width="2"/>
    <line x1="24" y1="50" x2="76" y2="50" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Outer Spikes -->
    <line x1="50" y1="18" x2="50" y2="10"/>
    <line x1="50" y1="82" x2="50" y2="90"/>
    <line x1="24" y1="50" x2="14" y2="50"/>
    <line x1="76" y1="50" x2="86" y2="50"/>

    <path d="M42 28 L34 20 M58 28 L66 20"/>
    <path d="M42 72 L34 80 M58 72 L66 80"/>
    <path d="M28 42 L20 34 M28 58 L20 66"/>
    <path d="M72 42 L80 34 M72 58 L80 66"/>
  </g>
  <!-- Center Core -->
  <circle cx="50" cy="50" r="7" fill="#ffffff" stroke="#1c1b1b" stroke-width="2.5"/>
</svg>
