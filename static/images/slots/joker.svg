<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="jokerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae100"/>
      <stop offset="50%" stop-color="#ff1493"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <filter id="jokerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="1" flood-color="#1c1b1b"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="6" y="6" width="88" height="88" rx="14" fill="#fdf2f8" stroke="#1c1b1b" stroke-width="4" filter="url(#jokerShadow)"/>
  <!-- Jester 3-Prong Hat -->
  <path d="M22 46 C20 28 10 24 16 18 C26 22 34 32 38 42 M50 38 C50 20 44 14 50 12 C56 14 50 20 50 38 M78 46 C80 28 90 24 84 18 C74 22 66 32 62 42" fill="none" stroke="#1c1b1b" stroke-width="4"/>
  <path d="M18 19 Q26 24 38 40 L62 40 Q74 24 82 19 L72 44 L28 44 Z" fill="url(#jokerGrad)" stroke="#1c1b1b" stroke-width="3"/>
  <!-- Jester Bells -->
  <circle cx="16" cy="18" r="4.5" fill="#fae100" stroke="#1c1b1b" stroke-width="2"/>
  <circle cx="50" cy="12" r="4.5" fill="#fae100" stroke="#1c1b1b" stroke-width="2"/>
  <circle cx="84" cy="18" r="4.5" fill="#fae100" stroke="#1c1b1b" stroke-width="2"/>
  <!-- Big Golden Star Face -->
  <polygon points="50,26 56,38 70,39 59,49 63,63 50,55 37,63 41,49 30,39 44,38" fill="#fae100" stroke="#1c1b1b" stroke-width="3"/>
  <!-- 90s Pixel/Wayfarer Sunglasses -->
  <rect x="36" y="44" width="12" height="7" rx="1" fill="#1c1b1b"/>
  <rect x="52" y="44" width="12" height="7" rx="1" fill="#1c1b1b"/>
  <line x1="48" y1="46" x2="52" y2="46" stroke="#1c1b1b" stroke-width="2.5"/>
  <line x1="37" y1="46" x2="41" y2="46" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="53" y1="46" x2="57" y2="46" stroke="#ffffff" stroke-width="1.5"/>
  <!-- Wild Text Banner -->
  <rect x="20" y="70" width="60" height="18" rx="4" fill="#b40065" stroke="#1c1b1b" stroke-width="3"/>
  <text x="50" y="83" font-family="'Bricolage Grotesque', sans-serif" font-weight="900" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="1">WILD</text>
</svg>
