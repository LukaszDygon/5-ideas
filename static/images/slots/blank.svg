<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="rustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b0bec5"/>
      <stop offset="50%" stop-color="#78909c"/>
      <stop offset="100%" stop-color="#455a64"/>
    </linearGradient>
    <filter id="blankShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="1" flood-color="#1c1b1b"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="6" y="6" width="88" height="88" rx="14" fill="#eceff1" stroke="#1c1b1b" stroke-width="4" filter="url(#blankShadow)"/>
  <!-- Iron Plate with Diagonal Rust Slits -->
  <circle cx="50" cy="50" r="30" fill="url(#rustGrad)" stroke="#1c1b1b" stroke-width="3"/>
  <circle cx="50" cy="50" r="14" fill="#cfd8dc" stroke="#1c1b1b" stroke-width="2"/>
  <!-- Dud cross-out / blank dash -->
  <line x1="32" y1="50" x2="68" y2="50" stroke="#1c1b1b" stroke-width="4" stroke-linecap="round"/>
  <!-- Rivets -->
  <circle cx="20" cy="20" r="2.5" fill="#1c1b1b"/>
  <circle cx="80" cy="20" r="2.5" fill="#1c1b1b"/>
  <circle cx="20" cy="80" r="2.5" fill="#1c1b1b"/>
  <circle cx="80" cy="80" r="2.5" fill="#1c1b1b"/>
</svg>
