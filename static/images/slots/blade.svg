<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#ff1493"/>
      <stop offset="60%" stop-color="#b40065"/>
      <stop offset="100%" stop-color="#4a0026"/>
    </linearGradient>
    <linearGradient id="hiltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae100"/>
      <stop offset="100%" stop-color="#ff5e00"/>
    </linearGradient>
    <filter id="bladeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="1" flood-color="#1c1b1b"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="6" y="6" width="88" height="88" rx="14" fill="#fff0f6" stroke="#1c1b1b" stroke-width="4" filter="url(#bladeGlow)"/>
  <!-- Crossed Broadswords -->
  <g stroke="#1c1b1b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <!-- Sword 1 -->
    <path d="M78 22 L45 55 L38 52 L35 59 L42 62 L38 66 L25 79 L20 74 L33 61 L29 57 L36 54 L33 47 L66 14 Z" fill="url(#bladeGrad)"/>
    <line x1="72" y1="28" x2="48" y2="52" stroke="#ffffff" stroke-width="2"/>
    <!-- Guard & Pommel -->
    <rect x="31" y="52" width="18" height="6" rx="2" fill="url(#hiltGrad)" transform="rotate(45 40 55)"/>
    <circle cx="21" cy="77" r="4.5" fill="#fae100"/>
    
    <!-- Sword 2 -->
    <path d="M22 22 L55 55 L62 52 L65 59 L58 62 L62 66 L75 79 L80 74 L67 61 L71 57 L64 54 L67 47 L34 14 Z" fill="url(#bladeGrad)"/>
    <line x1="28" y1="28" x2="52" y2="52" stroke="#ffffff" stroke-width="2"/>
    <rect x="51" y="52" width="18" height="6" rx="2" fill="url(#hiltGrad)" transform="rotate(-45 60 55)"/>
    <circle cx="79" cy="77" r="4.5" fill="#fae100"/>
  </g>
  <!-- Slashes / Energy Sparks -->
  <polygon points="50,16 54,26 64,28 56,34 58,44 50,38 42,44 44,34 36,28 46,26" fill="#fae100" stroke="#1c1b1b" stroke-width="2"/>
</svg>
