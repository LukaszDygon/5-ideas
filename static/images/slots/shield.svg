<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#00e5ff"/>
      <stop offset="70%" stop-color="#008190"/>
      <stop offset="100%" stop-color="#003b42"/>
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fae100"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
    <filter id="shieldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="1" flood-color="#1c1b1b"/>
    </filter>
  </defs>
  <!-- Background Badge -->
  <rect x="6" y="6" width="88" height="88" rx="14" fill="#e0f7fa" stroke="#1c1b1b" stroke-width="4" filter="url(#shieldShadow)"/>
  <!-- Shield Outer Rim -->
  <path d="M50 16 L78 26 C78 52 66 72 50 84 C34 72 22 52 22 26 Z" fill="url(#goldRim)" stroke="#1c1b1b" stroke-width="4"/>
  <!-- Shield Inner Core -->
  <path d="M50 22 L72 30 C72 50 62 67 50 77 C38 67 28 50 28 30 Z" fill="url(#shieldGrad)" stroke="#1c1b1b" stroke-width="3"/>
  <!-- Center Boss Emblem -->
  <circle cx="50" cy="46" r="12" fill="#ffffff" stroke="#1c1b1b" stroke-width="3"/>
  <polygon points="50,38 53,44 59,44 54,48 56,54 50,50 44,54 46,48 41,44 47,44" fill="#fae100" stroke="#1c1b1b" stroke-width="1.5"/>
  <!-- Heavy Rivets -->
  <circle cx="34" cy="30" r="2.5" fill="#1c1b1b"/>
  <circle cx="66" cy="30" r="2.5" fill="#1c1b1b"/>
  <circle cx="71" cy="48" r="2.5" fill="#1c1b1b"/>
  <circle cx="29" cy="48" r="2.5" fill="#1c1b1b"/>
  <circle cx="50" cy="74" r="2.5" fill="#1c1b1b"/>
</svg>
